<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bağlantı yok — TrendMatik</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:#f7f8fb;color:#16203a;
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  .kutu{max-width:420px;text-align:center}
  .ikon{font-size:44px;margin-bottom:14px}
  h1{font-size:21px;margin:0 0 10px}
  p{font-size:14px;line-height:1.65;color:#5b6478;margin:0 0 22px}
  button{height:40px;padding:0 20px;border:0;border-radius:10px;background:#3a45e0;
         color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  @media (prefers-color-scheme: dark){
    body{background:#0b1120;color:#e8ecf5}
    p{color:#8b96b0}
  }
</style>
</head>
<body>
  <div class="kutu">
    <div class="ikon">📡</div>
    <h1>Bağlantı yok</h1>
    <p>
      TrendMatik sıralamaları canlı veriyle çalışıyor, bu yüzden çevrimdışı
      gösteremiyoruz. Bağlantın gelince kaldığın yerden devam edebilirsin.
    </p>
    <button onclick="location.reload()">Yeniden dene</button>
  </div>
</body>
</html>
